name: Setup Workspace
description: Install locked pnpm + Node 24 workspace dependencies with pnpm store cache

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
      with:
        version: 10.33.1
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
