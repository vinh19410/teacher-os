name: Việc cho ai-handle
description: Một việc đủ rõ để agent tự làm, tự kiểm và (nếu rủi ro thấp) tự merge vào develop.
title: "[ai-handle] "
body:
  - type: markdown
    attributes:
      value: |
        Form này **không** tự gắn label `ai-handle`. Người gắn label `ai-handle` rồi kéo card sang **Ready** trên board
        "Teacher OS" là bước duyệt; thiếu một trong hai thì agent không nhận việc.
        Không cho agent: deploy, release, tag, đổi secret, migration xoá dữ liệu, việc cần thiết bị thật hoặc
        duyệt giao diện bằng mắt.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Vấn đề người dùng gặp và vì sao cần làm bây giờ.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      description: Nền tảng bị ảnh hưởng.
      options:
        - label: web (app giáo viên)
        - label: server (API)
        - label: student (portal học sinh)
        - label: landing
        - label: packages (api/auth/db/ui/...)
        - label: infra
        - label: docs
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: Những gì KHÔNG làm.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checklist kiểm chứng được bằng test, vector hoặc hành vi quan sát được. Mỗi dòng bắt đầu bằng `- [ ]`.
      placeholder: |
        - [ ] Hành vi A quan sát được như sau ...
        - [ ] Đụng UI: `pnpm check && pnpm check-types && pnpm --filter web test` pass
        - [ ] Đụng API: `pnpm --filter server test` pass; e2e chạy xanh qua
          `E2E_API_PORT=8100 E2E_WEB_PORT=8101 E2E_STUDENT_PORT=8103 pnpm --filter e2e e2e`
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk
      description: Chỉ để tham khảo. Mọi issue đều chạy /ak:vibe --ship --beta --advice, agent tự merge vào develop.
      options:
        - Low
        - High
      default: 0
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0
        - P1
        - P2
        - P3
      default: 2
    validations:
      required: true
