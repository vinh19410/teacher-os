# Workflow audit & promote bộ từ vựng giáo viên tạo (vocab_group, vocab_deck,
# vocab_word + R2 audio) từ Cloudflare D1 staging lên production.
#
# Ràng buộc an toàn (test gate: scripts/ci-workflow.test.mjs):
# - Chỉ chạy bằng manual workflow_dispatch; không trigger tự động.
# - Mặc định ở chế độ audit-staging (read-only trên staging).
# - Chế độ dry-run chỉ đọc cả staging & production để đối chiếu xung đột.
# - Chế độ apply yêu cầu gõ xác nhận chính xác "prod" vào confirm_prod và chạy
#   dưới GitHub Environment "production" (chỉ nhánh main được phép deploy).
# - Serialize với deploy qua cùng concurrency group deploy-staging / deploy-production.
# - Quyền contents: read ở cấp top-level; không upload artifact nhạy cảm.
# - Repo PUBLIC: luôn truyền --public-logs để không in UUID/ID nội bộ ra log.
name: Promote Vocab Staging to Prod

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Chế độ: audit-staging (liệt kê staging), dry-run (xem trước diff prod), apply (ghi lên prod)"
        type: choice
        options:
          - audit-staging
          - dry-run
          - apply
        default: audit-staging
        required: true
      group_names:
        description: "Tên các vocab_group cần promote, phân tách bằng dấu ';' (VD: Giao tiếp Level 1; Giao tiếp Level 2)"
        type: string
        required: false
        default: ""
      deck_titles:
        description: "Tiêu đề các bank vocab_deck đơn lẻ nếu không chọn theo group, phân tách bằng dấu ';'"
        type: string
        required: false
        default: ""
      target_org_id:
        description: "Org đích trên production (để trống sẽ tự phân giải theo TEACHER_EMAILS -> fallback LEAD_ORG_ID)"
        type: string
        required: false
        default: ""
      relocate_from_lead_org:
        description: "Cho phép chuyển các bộ từ khớp ID đang nằm ở LEAD_ORG_ID sang org giáo viên đang hoạt động"
        type: boolean
        required: false
        default: false
      confirm_prod:
        description: "Gõ đúng chữ 'prod' để xác nhận khi chạy mode=apply"
        type: string
        required: false
        default: ""

concurrency:
  group: deploy-${{ inputs.mode == 'audit-staging' && 'staging' || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.mode == 'audit-staging' && 'staging' || 'production' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace

      - name: Validate inputs and safety gate
        env:
          PROMOTE_MODE: ${{ inputs.mode }}
          GROUP_NAMES: ${{ inputs.group_names }}
          DECK_TITLES: ${{ inputs.deck_titles }}
          CONFIRM_PROD: ${{ inputs.confirm_prod }}
        run: |
          if [ "$PROMOTE_MODE" != "audit-staging" ]; then
            if [ -z "$GROUP_NAMES" ] && [ -z "$DECK_TITLES" ]; then
              echo "::error::Mode '$PROMOTE_MODE' bắt buộc phải truyền group_names hoặc deck_titles."
              exit 1
            fi
          fi
          if [ "$PROMOTE_MODE" = "apply" ]; then
            if [ "$CONFIRM_PROD" != "prod" ]; then
              echo "::error::Mode 'apply' bắt buộc phải gõ đúng chữ 'prod' trong confirm_prod."
              exit 1
            fi
            echo "Đã xác nhận chính xác 'prod'. Tiếp tục thực thi apply."
          fi

      - name: Run vocab staging-to-prod migration
        working-directory: packages/db
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LEAD_ORG_ID: ${{ vars.LEAD_ORG_ID }}
          TEACHER_EMAILS: ${{ vars.TEACHER_EMAILS }}
          PROMOTE_MODE: ${{ inputs.mode }}
          GROUP_NAMES: ${{ inputs.group_names }}
          DECK_TITLES: ${{ inputs.deck_titles }}
          TARGET_ORG_ID: ${{ inputs.target_org_id }}
          RELOCATE_FROM_LEAD_ORG: ${{ inputs.relocate_from_lead_org }}
          CONFIRM_PROD: ${{ inputs.confirm_prod }}
        run: |
          set -euo pipefail
          args=(--d1 --mode "$PROMOTE_MODE" --public-logs)
          if [ -n "$GROUP_NAMES" ]; then
            args+=(--group-names "$GROUP_NAMES")
          fi
          if [ -n "$DECK_TITLES" ]; then
            args+=(--deck-titles "$DECK_TITLES")
          fi
          if [ -n "$TARGET_ORG_ID" ]; then
            args+=(--target-org-id "$TARGET_ORG_ID")
          fi
          if [ "$RELOCATE_FROM_LEAD_ORG" = "true" ] && [ -n "$LEAD_ORG_ID" ]; then
            args+=(--relocate-from-org "$LEAD_ORG_ID")
          fi
          if [ "$PROMOTE_MODE" = "apply" ]; then
            args+=(--allow-prod --confirm-prod "$CONFIRM_PROD" --dump /tmp/promote-vocab-prod-backup)
          fi
          pnpm exec tsx scripts/promote-vocab-prod.ts "${args[@]}"
