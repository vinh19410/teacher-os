# Production deploy: merge develop -> main ships to Cloudflare stage "prod".
#
# Design constraints (see docs/production-release-runbook.md):
# - Deploy job runs only after the same quality gates as CI pass on this ref,
#   so a bypassed/failing CI can never ship. The full Playwright E2E suite also
#   gates production (and only production): it is split across 6 runners with
#   --fully-parallel so the wall-clock stays low. Staging and PR pipelines do
#   not run it.
# - Concurrency serializes deploys without cancelling a run in progress:
#   alchemy applies forward-only D1 migrations, and two overlapping deploys
#   would race the migration ledger.
# - CORS_ORIGIN must NOT be set here — with APP_DOMAIN present it defaults to
#   the derived https://app.<domain> and an explicit disagreeing value fails
#   the whole run by design.
# - ci-workflow.test.mjs forbids secrets in ci.yml/quality.yml; this file is
#   deliberately separate so prod credentials stay out of the PR pipeline.
name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the Alchemy plan only: apply nothing, skip smoke"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Single source of topology: packages/infra/src/topology.ts derives
  # app.<domain>, api.<domain>, cookie domain and the Google redirect URI.
  APP_DOMAIN: teacheros.io.vn
  API_READY_URL: https://api.teacheros.io.vn/readyz
  APP_ORIGIN: https://app.teacheros.io.vn
  LANDING_ORIGIN: https://teacheros.io.vn
  API_BASE_URL: https://api.teacheros.io.vn
  PROFILE_ORIGIN: https://msmy.io.vn

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    with:
      turbo-cache: false

  e2e:
    # Each shard boots its own api/vite stack and fresh libsql DB (boot:api
    # wipes it), so shards never share state. --fully-parallel lets Playwright
    # balance by test instead of by spec file; specs whose tests depend on each
    # other must stay in a serial describe so they land on one shard together.
    # No secrets: the stack is local and talks to nothing in production.
    name: e2e (shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.62.1-ubuntu-latest
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      - run: pnpm --filter e2e e2e --fully-parallel --shard=${{ matrix.shard }}/6
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          retention-days: 7

  deploy:
    needs: [quality, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - name: Deploy to Cloudflare (stage prod)
        working-directory: packages/infra
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Tên secret Actions là GH_WEBHOOK_SECRET (Actions cấm tiền tố
          # GITHUB_); tên env/binding Worker vẫn là GITHUB_WEBHOOK_SECRET.
          GITHUB_WEBHOOK_SECRET: ${{ secrets.GH_WEBHOOK_SECRET }}
          MAILER_IMPL: ${{ vars.MAILER_IMPL }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          # Single-org (#513): danh sách email giáo viên chủ app; rỗng trên prod sẽ fail-closed.
          TEACHER_EMAILS: ${{ vars.TEACHER_EMAILS }}
          # Lead intake & placement test (#506, #515, #524): truyền từ GitHub Environment production.
          LEAD_ORG_ID: ${{ vars.LEAD_ORG_ID }}
          LEAD_ORIGINS: ${{ vars.LEAD_ORIGINS }}
        run: pnpm alchemy deploy --stage prod ${{ inputs.dry_run && '--dry-run' || '--yes' }}
        # --yes auto-approves the plan: without it Alchemy exits code 0 in a
        # non-interactive terminal WITHOUT applying anything ("Non-interactive
        # terminal detected"), which made a no-op deploy look green.
      - name: Smoke check API readiness (/readyz)
        if: ${{ !inputs.dry_run }}
        # First deploy of a custom domain may wait on DNS/cert provisioning;
        # poll up to ~10 minutes before declaring the release failed.
        run: |
          for attempt in $(seq 1 30); do
            status=$(curl -sS -o /tmp/readyz.json -w '%{http_code}' "$API_READY_URL" || true)
            if [ "$status" = "200" ] && grep -q '"ok":true' /tmp/readyz.json; then
              echo "/readyz OK after attempt $attempt:"
              cat /tmp/readyz.json
              exit 0
            fi
            echo "attempt $attempt: HTTP $status, retrying in 20s"
            sleep 20
          done
          echo "::error::/readyz did not return 200 {\"ok\":true} within 10 minutes of deploy"
          exit 1
      - name: Smoke check auth stubs (/sw.js, /registerSW.js)
        if: ${{ !inputs.dry_run }}
        # Issue #125: the removed PWA SW's self-heal chain depends on these
        # files being served as real JavaScript with cache headers that keep
        # the SW update check on the network. Prod deliberately gets no
        # sign-up smoke (no junk rows in prod D1) — API-level auth is
        # exercised by the staging smoke on develop before promotion.
        # Retries mirror /readyz: first deploys wait on DNS/cert provisioning.
        run: |
          fail() { echo "::error::$1"; exit 1; }
          stubs_ok() {
            local f code
            for f in sw.js registerSW.js; do
              code=$(curl -sS --connect-timeout 5 --max-time 30 \
                -D /tmp/stub-headers.txt -o "/tmp/$f" -w '%{http_code}' \
                "$APP_ORIGIN/$f") || return 1
              [ "$code" = "200" ] || { echo "GET /$f returned HTTP $code"; return 1; }
              grep -qi '^content-type: text/javascript' /tmp/stub-headers.txt \
                || { echo "/$f is not served as JavaScript (SPA fallback HTML as SW update target?)"; return 1; }
              grep -Eiq '^cache-control:.*(max-age=0|no-store|no-cache)' /tmp/stub-headers.txt \
                || { echo "/$f cache-control must pin the update check to the network (max-age=0, no-store, or no-cache)"; return 1; }
            done
            grep -q unregister /tmp/sw.js || { echo "/sw.js must be the self-unregister stub"; return 1; }
            grep -q "caches.delete" /tmp/sw.js || { echo "/sw.js stub lost its cache purge"; return 1; }
            return 0
          }
          ok=""
          for attempt in 1 2 3; do
            if reason=$(stubs_ok); then ok=1; break; fi
            echo "attempt $attempt failed: $reason — retrying in 20s"
            [ "$attempt" = "3" ] || sleep 20
          done
          [ -n "$ok" ] || fail "stub smoke failed after 3 attempts: /sw.js + /registerSW.js not correctly served"
          echo "stub smoke OK: /sw.js + /registerSW.js served as JS with network-first cache headers"
      - name: Smoke check landing apex (/)
        if: ${{ !inputs.dry_run }}
        # Apex handover (web → landing StaticSite): the first attach of the
        # custom domain may wait on DNS/cert provisioning; poll up to ~10
        # minutes like /readyz.
        run: |
          for attempt in $(seq 1 30); do
            code=$(curl -sS --connect-timeout 5 --max-time 30 \
              -D /tmp/landing-headers.txt -o /tmp/landing.html \
              -w '%{http_code}' "$LANDING_ORIGIN/" || true)
            if [ "$code" = "200" ] \
              && grep -qi '^content-type: text/html' /tmp/landing-headers.txt \
              && grep -q 'Cô Mỹ Dạy Tiếng Anh' /tmp/landing.html; then
              echo "landing apex OK after attempt $attempt"
              exit 0
            fi
            echo "attempt $attempt: HTTP $code, retrying in 20s"
            sleep 20
          done
          echo "::error::landing apex did not serve HTML within 10 minutes of deploy"
          exit 1
      - name: Smoke check profile
        if: ${{ !inputs.dry_run }}
        # Plan #536: teacher profile StaticSite (msmy.io.vn + www). Poll up to
        # ~10 minutes like landing; verify both HTML pages have the stage's
        # lead-api meta, www alias responds 200 HTML, and /kiem-tra-dau-vao
        # redirects to the trailing-slash directory URL.
        run: |
          for attempt in $(seq 1 30); do
            home_code=$(curl -sS --connect-timeout 5 --max-time 30 \
              -D /tmp/profile-headers.txt -o /tmp/profile.html \
              -w '%{http_code}' "$PROFILE_ORIGIN/" || true)
            test_code=$(curl -sS --connect-timeout 5 --max-time 30 \
              -D /tmp/profile-test-headers.txt -o /tmp/profile-test.html \
              -w '%{http_code}' "$PROFILE_ORIGIN/kiem-tra-dau-vao/" || true)
            redir_code=$(curl -sS --connect-timeout 5 --max-time 30 \
              -D /tmp/profile-redir-headers.txt -o /dev/null \
              -w '%{http_code}' "$PROFILE_ORIGIN/kiem-tra-dau-vao" || true)
            www_code=$(curl -sS --connect-timeout 5 --max-time 30 \
              -D /tmp/profile-www-headers.txt -o /tmp/profile-www.html \
              -w '%{http_code}' "https://www.msmy.io.vn/" || true)
            if [ "$home_code" = "200" ] \
              && grep -qi '^content-type: text/html' /tmp/profile-headers.txt \
              && grep -Fq "<meta name=\"lead-api\" content=\"$API_BASE_URL\">" /tmp/profile.html \
              && [ "$test_code" = "200" ] \
              && grep -qi '^content-type: text/html' /tmp/profile-test-headers.txt \
              && grep -Fq "<meta name=\"lead-api\" content=\"$API_BASE_URL\">" /tmp/profile-test.html \
              && echo "$redir_code" | grep -Eq '^(301|307|308)$' \
              && grep -Eiq '^location:.*kiem-tra-dau-vao/' /tmp/profile-redir-headers.txt \
              && [ "$www_code" = "200" ] \
              && grep -qi '^content-type: text/html' /tmp/profile-www-headers.txt; then
              echo "profile smoke OK after attempt $attempt"
              exit 0
            fi
            echo "attempt $attempt: home=$home_code test=$test_code redir=$redir_code www=$www_code, retrying in 20s"
            sleep 20
          done
          echo "::error::profile did not pass smoke checks within 10 minutes of deploy"
          exit 1
