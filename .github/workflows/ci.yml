name: CI

on:
  pull_request:
    branches: [main, develop]
    paths-ignore: ["plans/**/*.md", "plans/reports/**/*.html"]
  push:
    branches: [main, develop]
    paths-ignore: ["plans/**/*.md", "plans/reports/**/*.html"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    with:
      turbo-cache: true
