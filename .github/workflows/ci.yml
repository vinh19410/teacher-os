name: CI

on:
  pull_request:
    branches: [main, develop]
    paths-ignore: ["plans/**/*.md", "plans/reports/**/*.html"]
  push:
    branches: [main, develop]
    paths-ignore: ["plans/**/*.md", "plans/reports/**/*.html"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    # A PR from develop already gets checks from the push run on the same SHA;
    # deploy.yml re-runs quality on main before shipping.
    if: github.event_name != 'pull_request' || github.head_ref != 'develop'
    uses: ./.github/workflows/quality.yml
    with:
      turbo-cache: true
