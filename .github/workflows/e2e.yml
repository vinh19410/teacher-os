# PR gate for main, and the reusable E2E job deploy.yml calls before shipping
# prod (a red E2E must block the release). No standalone push trigger: every
# push to main already runs this suite through deploy.yml.
name: E2E

on:
  pull_request:
    branches: [main]
  workflow_call: {}

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.62.1-ubuntu-latest
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      - run: pnpm --filter e2e e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7
