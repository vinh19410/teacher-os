# Staging deploy to Cloudflare stage "staging"
# (app/api.staging.teacheros.io.vn) — the QA environment.
#
# Trigger: every push to the dedicated `staging` branch deploys staging.
# Promote a build for QA by fast-forwarding `staging` to the develop commit
# under test (git push origin develop:staging, or merge a PR into staging).
# Merging into `develop` alone still does NOT deploy (develop auto-deploy was
# removed 2026-09-22). workflow_dispatch stays for manual migration rehearsal
# (docs/production-release-runbook.md, "Provision staging"). The GitHub
# environment "staging" must allow the `staging` branch (deployment branch
# policy) or the deploy job is rejected.
#
# Sibling of deploy.yml (prod) with the same design constraints (see
# docs/production-release-runbook.md, "Provision staging"):
# - Deploy job runs only after the same quality gates as CI pass on this ref,
#   so a bypassed/failing CI can never ship.
# - Concurrency serializes staging deploys without cancelling a run in
#   progress: alchemy applies forward-only D1 migrations, and two overlapping
#   deploys would race the migration ledger.
# - CORS_ORIGIN must NOT be set here — with APP_DOMAIN present it defaults to
#   the derived https://app.staging.teacheros.io.vn and an explicit disagreeing
#   value fails the whole run by design.
# - ci-workflow.test.mjs forbids secrets.* in ci.yml/e2e.yml; staging
#   credentials live in the GitHub environment "staging" (same secret names as
#   production) and stay out of the PR pipeline.
# - The deploy smoke covers auth (issue #125): /readyz alone shipped green
#   while staging signup/sign-in was QC-blocking. Throwaway smoke accounts are
#   accepted junk rows in the staging D1; prod deliberately gets no signup
#   smoke (no junk rows in prod D1).
name: Deploy Staging

on:
  push:
    branches: [staging]
  workflow_dispatch: {}

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Single source of topology: packages/infra/src/topology.ts derives
  # app.<domain>, api.<domain>, cookie domain and the Google redirect URI.
  APP_DOMAIN: staging.teacheros.io.vn
  # The prod apex whose cookie zone nests staging's (issue #125): the auth
  # smoke plants a prod-shaped parent-domain session cookie from this zone.
  # Kept as an explicit literal (not derived from APP_DOMAIN) so the poison
  # stays correct even if APP_DOMAIN ever stops being a subdomain of prod.
  PARENT_DOMAIN: teacheros.io.vn
  API_READY_URL: https://api.staging.teacheros.io.vn/readyz
  APP_ORIGIN: https://app.staging.teacheros.io.vn
  LANDING_ORIGIN: https://staging.teacheros.io.vn
  API_BASE_URL: https://api.staging.teacheros.io.vn

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SERVER_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome check .
      - run: pnpm test
      - run: pnpm check-types
      - run: pnpm build

  deploy:
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy to Cloudflare (stage staging)
        working-directory: packages/infra
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Tên secret Actions là GH_WEBHOOK_SECRET (Actions cấm tiền tố
          # GITHUB_); tên env/binding Worker vẫn là GITHUB_WEBHOOK_SECRET.
          GITHUB_WEBHOOK_SECRET: ${{ secrets.GH_WEBHOOK_SECRET }}
          MAILER_IMPL: ${{ vars.MAILER_IMPL }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
        run: pnpm alchemy deploy --stage staging --yes
        # --yes auto-approves the plan: without it Alchemy exits code 0 in a
        # non-interactive terminal WITHOUT applying anything ("Non-interactive
        # terminal detected"), which made a no-op deploy look green.
      - name: Smoke check API readiness (/readyz)
        # First deploy of a custom domain may wait on DNS/cert provisioning;
        # poll up to ~10 minutes before declaring the deploy failed.
        run: |
          for attempt in $(seq 1 30); do
            status=$(curl -sS -o /tmp/readyz.json -w '%{http_code}' "$API_READY_URL" || true)
            if [ "$status" = "200" ] && grep -q '"ok":true' /tmp/readyz.json; then
              echo "/readyz OK after attempt $attempt:"
              cat /tmp/readyz.json
              exit 0
            fi
            echo "attempt $attempt: HTTP $status, retrying in 20s"
            sleep 20
          done
          echo "::error::/readyz did not return 200 {\"ok\":true} within 10 minutes of deploy"
          exit 1
      - name: Smoke check auth (sign-up → get-session)
        # Issue #125: /readyz cannot see auth breakage (cookie config, CORS,
        # secret, D1 session store). Request shape follows
        # apps/server/src/auth-roundtrip.test.ts. One throwaway account per
        # deploy; credentials are generated per run and never echoed.
        #
        # The jar is POISONED before sign-up with a prod-shaped parent-domain
        # session cookie (round-2 repro): any browser that ever held a session
        # on the prod zone carries `__Secure-better-auth.session_token;
        # Domain=.teacheros.io.vn`, and browsers send it to the staging API
        # too. Staging must resolve the session from its own namespaced
        # cookie (__Secure-teacheros-staging.session_token) and ignore the
        # foreign one — get-session returning a user from this poisoned jar is
        # the exact end state that failed for QC. printf (not echo) because
        # Netscape jar fields are TAB-separated.
        run: |
          fail() { echo "::error::$1"; exit 1; }
          # run_id+run_attempt keeps the email unique across queued runs AND
          # re-runs of the same run (a re-run must not 422 on a reused email).
          # Failure is signalled by exit status, not an inner ::error:: — a
          # fail() inside $( ) would be captured into $code and never rendered.
          attempt_signup() {
            local suffix="$1" email pass
            email="smoke-${GITHUB_RUN_ID}${suffix}-${GITHUB_RUN_ATTEMPT}@smoke.teacheros.internal"
            pass="$(openssl rand -hex 16)"
            rm -f /tmp/smoke-jar.txt
            printf '#HttpOnly_.%s\tTRUE\t/\tTRUE\t0\t__Secure-better-auth.session_token\tbogus\n' "$PARENT_DOMAIN" >> /tmp/smoke-jar.txt
            # -b AND -c: -b loads the poison into the cookie engine (and sends
            # it with the request, like a poisoned browser); -c alone would
            # overwrite the jar from an empty in-memory state and destroy the
            # poison (verified: curl keeps the loaded session cookie in the
            # jar written by -c only when it was loaded via -b).
            curl -sS --connect-timeout 5 --max-time 30 -b /tmp/smoke-jar.txt -c /tmp/smoke-jar.txt \
              -o /tmp/smoke-signup.json -w '%{http_code}' \
              -X POST "$API_BASE_URL/api/auth/sign-up/email" \
              -H "Content-Type: application/json" \
              -H "Origin: $APP_ORIGIN" \
              -d "{\"name\":\"Deploy Smoke\",\"email\":\"$email\",\"password\":\"$pass\"}"
          }
          code=$(attempt_signup "") || fail "sign-up smoke request failed"
          if [ "$code" = "429" ]; then
            # better-auth's default rule allows 3 /sign-up requests per 10s per
            # IP; shared runner IPs can collide with manual QC traffic.
            echo "::warning::sign-up smoke hit the auth rate limit (HTTP 429); retrying once"
            sleep 11
            code=$(attempt_signup "-retry") || fail "sign-up smoke retry request failed"
          fi
          [ "$code" = "200" ] || fail "sign-up smoke returned HTTP $code, expected 200"
          grep -q "teacheros-staging.session_token" /tmp/smoke-jar.txt \
            || fail "sign-up smoke set no namespaced session cookie (stage cookie prefix wiring regression)"
          grep -q "__Secure-better-auth.session_token" /tmp/smoke-jar.txt \
            || fail "poisoned foreign cookie vanished from the jar — smoke no longer reproduces the issue #125 poisoned-browser shape"
          code=$(curl -sS --connect-timeout 5 --max-time 30 -b /tmp/smoke-jar.txt \
            -o /tmp/smoke-session.json -w '%{http_code}' \
            "$API_BASE_URL/api/auth/get-session") || fail "get-session smoke request failed"
          [ "$code" = "200" ] || fail "get-session smoke returned HTTP $code, expected 200"
          grep -q '"user"' /tmp/smoke-session.json \
            || fail "get-session did not return a user from the poisoned jar (a foreign prod-zone cookie is shadowing the namespaced session — issue #125 regression)"
          echo "auth smoke OK: sign-up set a namespaced cookie and get-session resolved the user despite the poisoned jar"
      - name: Smoke check auth stubs (/sw.js, /registerSW.js)
        # Issue #125: the removed PWA SW's self-heal chain depends on these
        # files being served as real JavaScript with cache headers that keep
        # the SW update check on the network — the SPA fallback would return
        # 200 HTML and silently strand every already-affected browser.
        # Retries mirror /readyz: first deploys wait on DNS/cert provisioning.
        run: |
          fail() { echo "::error::$1"; exit 1; }
          stubs_ok() {
            local f code
            for f in sw.js registerSW.js; do
              code=$(curl -sS --connect-timeout 5 --max-time 30 \
                -D /tmp/stub-headers.txt -o "/tmp/$f" -w '%{http_code}' \
                "$APP_ORIGIN/$f") || return 1
              [ "$code" = "200" ] || { echo "GET /$f returned HTTP $code"; return 1; }
              grep -qi '^content-type: text/javascript' /tmp/stub-headers.txt \
                || { echo "/$f is not served as JavaScript (SPA fallback HTML as SW update target?)"; return 1; }
              grep -Eiq '^cache-control:.*(max-age=0|no-store|no-cache)' /tmp/stub-headers.txt \
                || { echo "/$f cache-control must pin the update check to the network (max-age=0, no-store, or no-cache)"; return 1; }
            done
            grep -q unregister /tmp/sw.js || { echo "/sw.js must be the self-unregister stub"; return 1; }
            grep -q "caches.delete" /tmp/sw.js || { echo "/sw.js stub lost its cache purge"; return 1; }
            return 0
          }
          ok=""
          for attempt in 1 2 3; do
            if reason=$(stubs_ok); then ok=1; break; fi
            echo "attempt $attempt failed: $reason — retrying in 20s"
            [ "$attempt" = "3" ] || sleep 20
          done
          [ -n "$ok" ] || fail "stub smoke failed after 3 attempts: /sw.js + /registerSW.js not correctly served"
          echo "stub smoke OK: /sw.js + /registerSW.js served as JS with network-first cache headers"
      - name: Smoke check landing apex (/)
        # Apex handover (web → landing StaticSite): the first attach of the
        # custom domain may wait on DNS/cert provisioning; poll up to ~10
        # minutes like /readyz.
        run: |
          for attempt in $(seq 1 30); do
            code=$(curl -sS --connect-timeout 5 --max-time 30 \
              -D /tmp/landing-headers.txt -o /tmp/landing.html \
              -w '%{http_code}' "$LANDING_ORIGIN/" || true)
            if [ "$code" = "200" ] \
              && grep -qi '^content-type: text/html' /tmp/landing-headers.txt \
              && grep -q 'Teacher OS' /tmp/landing.html; then
              echo "landing apex OK after attempt $attempt"
              exit 0
            fi
            echo "attempt $attempt: HTTP $code, retrying in 20s"
            sleep 20
          done
          echo "::error::landing apex did not serve HTML within 10 minutes of deploy"
          exit 1
