# Staging deploy to Cloudflare stage "staging"
# (lms/api.staging.teacheros.io.vn) — the QA environment.
#
# Trigger: every push to `develop` (a merged PR included) deploys staging, so
# QA always sees the latest develop. The dedicated `staging` branch no longer
# triggers a deploy. workflow_dispatch stays for manual migration rehearsal
# (docs/production-release-runbook.md, "Provision staging"). The GitHub
# environment "staging" must allow the `develop` branch (deployment branch
# policy) or the deploy job is rejected.
#
# Sibling of deploy.yml (prod) with the same design constraints (see
# docs/production-release-runbook.md, "Provision staging"):
# - Deploy job runs only after the same quality gates as CI pass on this ref,
#   so a bypassed/failing CI can never ship.
# - Concurrency serializes staging deploys without cancelling a run in
#   progress: alchemy applies forward-only D1 migrations, and two overlapping
#   deploys would race the migration ledger.
# - CORS_ORIGIN must NOT be set here — with APP_DOMAIN present it defaults to
#   the derived https://lms.staging.teacheros.io.vn and an explicit disagreeing
#   value fails the whole run by design.
# - ci-workflow.test.mjs forbids secrets in ci.yml/quality.yml/e2e.yml; staging
#   credentials live in the GitHub environment "staging" (same secret names as
#   production) and stay out of the PR pipeline.
# - The deploy smoke covers auth (issue #125): /readyz alone shipped green
#   while staging signup/sign-in was QC-blocking. Throwaway smoke accounts are
#   accepted junk rows in the staging D1; prod deliberately gets no signup
#   smoke (no junk rows in prod D1).
name: Deploy Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the Alchemy plan only: apply nothing, skip seed and smoke"
        type: boolean
        default: false

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Single source of topology: packages/infra/src/topology.ts derives
  # lms.<domain> (with legacy aliases app/student/admin.<domain>), api.<domain>,
  # cookie domain and the Google redirect URI.
  APP_DOMAIN: staging.teacheros.io.vn
  # The prod apex whose cookie zone nests staging's (issue #125): the auth
  # smoke plants a prod-shaped parent-domain session cookie from this zone.
  # Kept as an explicit literal (not derived from APP_DOMAIN) so the poison
  # stays correct even if APP_DOMAIN ever stops being a subdomain of prod.
  PARENT_DOMAIN: teacheros.io.vn
  API_READY_URL: https://api.staging.teacheros.io.vn/readyz
  LMS_ORIGIN: https://lms.staging.teacheros.io.vn
  LEGACY_APP_ORIGIN: https://app.staging.teacheros.io.vn
  LEGACY_STUDENT_ORIGIN: https://student.staging.teacheros.io.vn
  LEGACY_ADMIN_ORIGIN: https://admin.staging.teacheros.io.vn
  LANDING_ORIGIN: https://staging.teacheros.io.vn
  API_BASE_URL: https://api.staging.teacheros.io.vn
  PROFILE_ORIGIN: https://profile.staging.teacheros.io.vn
  # Staging luôn bật trang profile đầy đủ để QA/kiểm thử; production kiểm soát qua apps/profile/maintenance.json.
  PROFILE_MAINTENANCE: "false"

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    with:
      turbo-cache: false

  deploy:
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the Discord beta number counts commits since the last version bump.
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
      - name: Detach legacy Worker custom domains before unified LMS cutover
        if: ${{ !inputs.dry_run }}
        timeout-minutes: 2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node packages/infra/scripts/detach-legacy-worker-domains.ts --stage staging
      - name: Deploy to Cloudflare (stage staging)
        working-directory: packages/infra
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ZOOM_ACCOUNT_ID: ${{ secrets.ZOOM_ACCOUNT_ID }}
          ZOOM_CLIENT_ID: ${{ secrets.ZOOM_CLIENT_ID }}
          ZOOM_CLIENT_SECRET: ${{ secrets.ZOOM_CLIENT_SECRET }}
          ZOOM_HOST_USER: ${{ vars.ZOOM_HOST_USER }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # #730: chấm nháp AI bài test đầu vào (rỗng = tắt; model rỗng = mặc định).
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_GRADING_MODEL: ${{ vars.OPENAI_GRADING_MODEL }}
          OPENAI_TRANSCRIBE_MODEL: ${{ vars.OPENAI_TRANSCRIBE_MODEL }}
          # Tên secret Actions là GH_WEBHOOK_SECRET (Actions cấm tiền tố
          # GITHUB_); tên env/binding Worker vẫn là GITHUB_WEBHOOK_SECRET.
          GITHUB_WEBHOOK_SECRET: ${{ secrets.GH_WEBHOOK_SECRET }}
          MAILER_IMPL: ${{ vars.MAILER_IMPL }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          # QA cần tài khoản admin test trên staging (#489); rỗng = không ai là admin.
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
          # Single-org (#513): danh sách email giáo viên (phân loại role teacher trên unified LMS và allowlist).
          TEACHER_EMAILS: ${{ vars.TEACHER_EMAILS }}
          # Lead intake & placement test (#506, #515, #524): truyền từ GitHub Environment staging.
          LEAD_ORG_ID: ${{ vars.LEAD_ORG_ID }}
          LEAD_ORIGINS: ${{ vars.LEAD_ORIGINS }}
          # SePay (my.sepay.vn): SEPAY_WEBHOOK_SECRET rỗng = tắt (503 SEPAY_DISABLED); SEPAY_API_TOKEN tùy chọn cho nút Đối soát.
          SEPAY_WEBHOOK_SECRET: ${{ secrets.SEPAY_WEBHOOK_SECRET }}
          SEPAY_API_TOKEN: ${{ secrets.SEPAY_API_TOKEN }}
          SEPAY_API_BASE_URL: ${{ vars.SEPAY_API_BASE_URL }}
          AI_ENABLED: ${{ vars.AI_ENABLED }}
          # Staging không gửi mail: mọi tài khoản coi như đã xác minh email.
          AUTH_ASSUME_EMAIL_VERIFIED: "true"
          # Staging bật lại menu Luyện tập & Lịch sử ở apps/student (#852 tắt mặc định trên PROD).
          STUDENT_PRACTICE_ENABLED: "true"
        run: pnpm alchemy deploy --stage staging ${{ inputs.dry_run && '--dry-run' || '--yes' }}
        # --yes auto-approves the plan: without it Alchemy exits code 0 in a
        # non-interactive terminal WITHOUT applying anything ("Non-interactive
        # terminal detected"), which made a no-op deploy look green.
      - name: Smoke check API readiness (/readyz)
        if: ${{ !inputs.dry_run }}
        # First deploy of a custom domain may wait on DNS/cert provisioning;
        # poll up to ~10 minutes before declaring the deploy failed.
        run: |
          for attempt in $(seq 1 30); do
            status=$(curl -sS -o /tmp/readyz.json -w '%{http_code}' "$API_READY_URL" || true)
            if [ "$status" = "200" ] && grep -q '"ok":true' /tmp/readyz.json; then
              echo "/readyz OK after attempt $attempt:"
              cat /tmp/readyz.json
              exit 0
            fi
            echo "attempt $attempt: HTTP $status, retrying in 20s"
            sleep 20
          done
          echo "::error::/readyz did not return 200 {\"ok\":true} within 10 minutes of deploy"
          exit 1
      - name: Seed built-in vocab library (staging only)
        if: ${{ !inputs.dry_run }}
        timeout-minutes: 5
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @teacher-os/db exec tsx scripts/seed-vocab-library.ts --d1 --d1-stage staging --if-needed --verify
      - name: Seed built-in study packs (staging only)
        if: ${{ !inputs.dry_run }}
        timeout-minutes: 5
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @teacher-os/db exec tsx scripts/seed-study-packs.ts --d1 --d1-stage staging --if-needed --verify
      - name: Smoke check auth (sign-up → get-session)
        if: ${{ !inputs.dry_run }}
        # Issue #125: /readyz cannot see auth breakage (cookie config, CORS,
        # secret, D1 session store). Request shape follows
        # apps/server/src/auth-roundtrip.test.ts. One throwaway account per
        # deploy; credentials are generated per run and never echoed.
        #
        # Signs up through the unified LMS origin: even when TEACHER_EMAILS is
        # set, unified-origin sign-up auto-classifies any email outside
        # ADMIN_EMAILS/TEACHER_EMAILS as student. Auth wiring and cookies are
        # the same across roles.
        #
        # The jar is POISONED before sign-up with a prod-shaped parent-domain
        # session cookie (round-2 repro): any browser that ever held a session
        # on the prod zone carries `__Secure-better-auth.session_token;
        # Domain=.teacheros.io.vn`, and browsers send it to the staging API
        # too. Staging must resolve the session from its own namespaced
        # cookie (__Secure-teacheros-staging.session_token) and ignore the
        # foreign one — get-session returning a user from this poisoned jar is
        # the exact end state that failed for QC. printf (not echo) because
        # Netscape jar fields are TAB-separated.
        run: |
          fail() { echo "::error::$1"; exit 1; }
          # run_id+run_attempt keeps the email unique across queued runs AND
          # re-runs of the same run (a re-run must not 422 on a reused email).
          # Failure is signalled by exit status, not an inner ::error:: — a
          # fail() inside $( ) would be captured into $code and never rendered.
          attempt_signup() {
            local suffix="$1" email pass
            email="smoke-${GITHUB_RUN_ID}${suffix}-${GITHUB_RUN_ATTEMPT}@smoke.teacheros.internal"
            pass="$(openssl rand -hex 16)"
            rm -f /tmp/smoke-jar.txt
            printf '#HttpOnly_.%s\tTRUE\t/\tTRUE\t0\t__Secure-better-auth.session_token\tbogus\n' "$PARENT_DOMAIN" >> /tmp/smoke-jar.txt
            # -b AND -c: -b loads the poison into the cookie engine (and sends
            # it with the request, like a poisoned browser); -c alone would
            # overwrite the jar from an empty in-memory state and destroy the
            # poison (verified: curl keeps the loaded session cookie in the
            # jar written by -c only when it was loaded via -b).
            curl -sS --connect-timeout 5 --max-time 30 -b /tmp/smoke-jar.txt -c /tmp/smoke-jar.txt \
              -o /tmp/smoke-signup.json -w '%{http_code}' \
              -X POST "$API_BASE_URL/api/auth/sign-up/email" \
              -H "Content-Type: application/json" \
              -H "Origin: $LMS_ORIGIN" \
              -d "{\"name\":\"Deploy Smoke\",\"email\":\"$email\",\"password\":\"$pass\"}"
          }
          code=$(attempt_signup "") || fail "sign-up smoke request failed"
          if [ "$code" = "429" ]; then
            # better-auth's default rule allows 3 /sign-up requests per 10s per
            # IP; shared runner IPs can collide with manual QC traffic.
            echo "::warning::sign-up smoke hit the auth rate limit (HTTP 429); retrying once"
            sleep 11
            code=$(attempt_signup "-retry") || fail "sign-up smoke retry request failed"
          fi
          [ "$code" = "200" ] || fail "sign-up smoke returned HTTP $code, expected 200"
          grep -q "teacheros-staging.session_token" /tmp/smoke-jar.txt \
            || fail "sign-up smoke set no namespaced session cookie (stage cookie prefix wiring regression)"
          grep -q "__Secure-better-auth.session_token" /tmp/smoke-jar.txt \
            || fail "poisoned foreign cookie vanished from the jar — smoke no longer reproduces the issue #125 poisoned-browser shape"
          code=$(curl -sS --connect-timeout 5 --max-time 30 -b /tmp/smoke-jar.txt \
            -o /tmp/smoke-session.json -w '%{http_code}' \
            "$API_BASE_URL/api/auth/get-session") || fail "get-session smoke request failed"
          [ "$code" = "200" ] || fail "get-session smoke returned HTTP $code, expected 200"
          grep -q '"user"' /tmp/smoke-session.json \
            || fail "get-session did not return a user from the poisoned jar (a foreign prod-zone cookie is shadowing the namespaced session — issue #125 regression)"
          echo "auth smoke OK: sign-up set a namespaced cookie and get-session resolved the user despite the poisoned jar"
      - name: Smoke check auth stubs (/sw.js, /registerSW.js)
        if: ${{ !inputs.dry_run }}
        # Issue #125: the removed PWA SW's self-heal chain depends on these
        # files being served as real JavaScript with cache headers that keep
        # the SW update check on the network on BOTH the canonical lms.<domain>
        # origin and the legacy app.<domain> host (where existing browsers may
        # still hold an old SW registration).
        # Retries mirror /readyz: first deploys wait on DNS/cert provisioning.
        run: |
          fail() { echo "::error::$1"; exit 1; }
          stubs_ok() {
            local origin f code
            for origin in "$LMS_ORIGIN" "$LEGACY_APP_ORIGIN"; do
              for f in sw.js registerSW.js; do
                code=$(curl -sS --connect-timeout 5 --max-time 30 \
                  -D /tmp/stub-headers.txt -o "/tmp/$f" -w '%{http_code}' \
                  "$origin/$f") || { echo "curl failed for $origin/$f"; return 1; }
                [ "$code" = "200" ] || { echo "GET $origin/$f returned HTTP $code"; return 1; }
                grep -qi '^content-type: text/javascript' /tmp/stub-headers.txt \
                  || { echo "$origin/$f is not served as JavaScript (SPA fallback HTML as SW update target?)"; return 1; }
                grep -Eiq '^cache-control:.*(max-age=0|no-store|no-cache)' /tmp/stub-headers.txt \
                  || { echo "$origin/$f cache-control must pin the update check to the network (max-age=0, no-store, or no-cache)"; return 1; }
              done
              grep -q unregister /tmp/sw.js || { echo "$origin/sw.js must be the self-unregister stub"; return 1; }
              grep -q "caches.delete" /tmp/sw.js || { echo "$origin/sw.js stub lost its cache purge"; return 1; }
            done
            return 0
          }
          ok=""
          for attempt in $(seq 1 30); do
            if reason=$(stubs_ok); then ok=1; break; fi
            echo "attempt $attempt failed: $reason — retrying in 20s"
            [ "$attempt" = "30" ] || sleep 20
          done
          [ -n "$ok" ] || fail "stub smoke failed after 30 attempts: /sw.js + /registerSW.js not correctly served on $LMS_ORIGIN and $LEGACY_APP_ORIGIN"
          echo "stub smoke OK: /sw.js + /registerSW.js served as JS with network-first cache headers on $LMS_ORIGIN and $LEGACY_APP_ORIGIN"
      - name: Smoke check LMS & legacy 301 redirects
        if: ${{ !inputs.dry_run }}
        # Unified LMS custom domain (lms.<domain>) and legacy aliases
        # (app/student/admin.<domain> -> 301 to lms.<domain>). Polls up to ~10
        # minutes to allow first-deploy custom-domain cert propagation.
        run: |
          fail() { echo "::error::$1"; exit 1; }
          check_redirect() {
            local url="$1" expected="$2" code location
            code=$(curl -sS --connect-timeout 5 --max-time 30 \
              -D /tmp/lms-redir-headers.txt -o /dev/null -w '%{http_code}' \
              "$url") || { echo "curl failed for $url"; return 1; }
            [ "$code" = "301" ] || { echo "GET $url returned HTTP $code, expected 301"; return 1; }
            location=$(grep -i '^location:' /tmp/lms-redir-headers.txt | head -n 1 | sed -E 's/^[Ll][Oo][Cc][Aa][Tt][Ii][Oo][Nn]:[[:space:]]*//' | tr -d '\r' || true)
            [ "$location" = "$expected" ] || { echo "GET $url redirected to '$location', expected '$expected'"; return 1; }
            return 0
          }
          check_shell_headers() {
            local url="$1" verify_bundle="${2:-false}" required_pattern="${3:-}" code asset_path asset_prefix lazy_ref found_api found_required
            code=$(curl -sS --connect-timeout 5 --max-time 30 \
              -D /tmp/lms-shell-headers.txt -o /tmp/lms-shell.html -w '%{http_code}' \
              -H "Accept: text/html" \
              "$url") || { echo "curl failed for $url"; return 1; }
            [ "$code" = "200" ] || { echo "GET $url returned HTTP $code, expected 200"; return 1; }
            grep -qi '^content-type: text/html' /tmp/lms-shell-headers.txt \
              || { echo "GET $url is not served as text/html"; return 1; }
            grep -qi '^strict-transport-security:' /tmp/lms-shell-headers.txt \
              || { echo "GET $url missing Strict-Transport-Security header (runWorkerFirst regression?)"; return 1; }
            grep -qi "^content-security-policy:.*media-src[^;]*${API_BASE_URL}" /tmp/lms-shell-headers.txt \
              || { echo "GET $url missing CSP media-src for $API_BASE_URL"; return 1; }
            if [ "$verify_bundle" = "true" ]; then
              found_api=""
              found_required=""
              : > /tmp/lms-lazy-assets.txt
              for asset_path in $( (grep -oE '(src|href)="(/([^"]*/)?assets/[^"]+\.js)"' /tmp/lms-shell.html || true) | sed -E 's/^(src|href)="([^"]+)"$/\2/' | awk '/auth-client|\/dist-|\/index-/ { print "0 " $0; next } { print "1 " $0 }' | sort -u | cut -d' ' -f2); do
                if curl -sS --connect-timeout 5 --max-time 30 -o /tmp/lms-asset.js "$LMS_ORIGIN$asset_path"; then
                  if [ -z "$found_api" ] && grep -Fq "$API_BASE_URL" /tmp/lms-asset.js; then
                    found_api=1
                  fi
                  if [ -n "$required_pattern" ] && [ -z "$found_required" ] && grep -Eq -- "$required_pattern" /tmp/lms-asset.js; then
                    found_required=1
                  fi
                  if [ -n "$found_api" ] && { [ -z "$required_pattern" ] || [ -n "$found_required" ]; }; then
                    break
                  fi
                  asset_prefix="${asset_path%/assets/*}"
                  (grep -oE '"(/?([^"]*/)?assets/[^"]+\.js)"' /tmp/lms-asset.js || true) | tr -d '"' | awk -v prefix="$asset_prefix" '{ if ($0 ~ /^\//) print $0; else print prefix "/" $0 }' >> /tmp/lms-lazy-assets.txt
                fi
              done
              if { [ -z "$found_api" ] || { [ -n "$required_pattern" ] && [ -z "$found_required" ]; }; } && [ -s /tmp/lms-lazy-assets.txt ]; then
                for lazy_ref in $(awk '/auth-client|\/dist-|\/index-/ { print "0 " $0; next } { print "1 " $0 }' /tmp/lms-lazy-assets.txt | sort -u | cut -d' ' -f2); do
                  if curl -sS --connect-timeout 5 --max-time 30 -o /tmp/lms-asset.js "$LMS_ORIGIN$lazy_ref"; then
                    if [ -z "$found_api" ] && grep -Fq "$API_BASE_URL" /tmp/lms-asset.js; then
                      found_api=1
                    fi
                    if [ -n "$required_pattern" ] && [ -z "$found_required" ] && grep -Eq -- "$required_pattern" /tmp/lms-asset.js; then
                      found_required=1
                    fi
                    if [ -n "$found_api" ] && { [ -z "$required_pattern" ] || [ -n "$found_required" ]; }; then
                      break
                    fi
                  fi
                done
              fi
              [ -n "$found_api" ] || { echo "GET $url JS bundle missing VITE_SERVER_URL ($API_BASE_URL) — runtime env validation would white-screen"; return 1; }
              if [ -n "$required_pattern" ] && [ -z "$found_required" ]; then
                echo "GET $url JS bundle missing required build flag pattern ($required_pattern) — staging feature flag wiring regression"
                return 1
              fi
            fi
            return 0
          }
          lms_ok() {
            local practice_flag_regex='VITE_STUDENT_PRACTICE_ENABLED["'\''`]?[[:space:]]*:[[:space:]]*["'\''`]true["'\''`]'
            check_shell_headers "$LMS_ORIGIN/" || return 1
            check_shell_headers "$LMS_ORIGIN/login" "true" || return 1
            check_shell_headers "$LMS_ORIGIN/teacher/" "true" || return 1
            check_shell_headers "$LMS_ORIGIN/student/" "true" "$practice_flag_regex" || return 1
            check_shell_headers "$LMS_ORIGIN/admin/" "true" || return 1
            check_redirect "$LEGACY_APP_ORIGIN/" "$LMS_ORIGIN/teacher" || return 1
            check_redirect "$LEGACY_APP_ORIGIN/classes" "$LMS_ORIGIN/teacher/classes" || return 1
            check_redirect "$LEGACY_APP_ORIGIN/pay/smoke-token" "$LMS_ORIGIN/pay/smoke-token" || return 1
            check_redirect "$LEGACY_STUDENT_ORIGIN/" "$LMS_ORIGIN/student" || return 1
            check_redirect "$LEGACY_STUDENT_ORIGIN/schedule" "$LMS_ORIGIN/student/schedule" || return 1
            check_redirect "$LEGACY_ADMIN_ORIGIN/" "$LMS_ORIGIN/admin" || return 1
            check_redirect "$LEGACY_ADMIN_ORIGIN/library/tests" "$LMS_ORIGIN/admin/library/tests" || return 1
            return 0
          }
          ok=""
          for attempt in $(seq 1 30); do
            if reason=$(lms_ok); then ok=1; break; fi
            echo "attempt $attempt failed: $reason — retrying in 20s"
            [ "$attempt" = "30" ] || sleep 20
          done
          [ -n "$ok" ] || fail "LMS & legacy 301 redirect smoke failed after 30 attempts"
          echo "LMS & legacy 301 redirect smoke OK"
      - name: Smoke check landing apex (/)
        if: ${{ !inputs.dry_run }}
        # Apex handover (web → landing StaticSite): the first attach of the
        # custom domain may wait on DNS/cert provisioning; poll up to ~10
        # minutes like /readyz.
        run: |
          for attempt in $(seq 1 30); do
            code=$(curl -sS --connect-timeout 5 --max-time 30 \
              -D /tmp/landing-headers.txt -o /tmp/landing.html \
              -w '%{http_code}' "$LANDING_ORIGIN/" || true)
            if [ "$code" = "200" ] \
              && grep -qi '^content-type: text/html' /tmp/landing-headers.txt \
              && grep -q 'Cô Mỹ Dạy Tiếng Anh' /tmp/landing.html; then
              echo "landing apex OK after attempt $attempt"
              exit 0
            fi
            echo "attempt $attempt: HTTP $code, retrying in 20s"
            sleep 20
          done
          echo "::error::landing apex did not serve HTML within 10 minutes of deploy"
          exit 1
      - name: Smoke check profile
        if: ${{ !inputs.dry_run }}
        # Plan #536: teacher profile StaticSite on staging
        # (profile.staging.teacheros.io.vn). Resolves effective maintenance mode
        # from PROFILE_MAINTENANCE env override + apps/profile/maintenance.json
        # via isProfileMaintenanceEnabled() so staging (PROFILE_MAINTENANCE=false)
        # verifies full profile routes and assets.
        run: |
          if node --input-type=module -e 'import { isProfileMaintenanceEnabled } from "./apps/profile/maintenance.mjs"; process.exit(isProfileMaintenanceEnabled() ? 0 : 1)'; then
            for attempt in $(seq 1 30); do
              home_code=$(curl -sS --connect-timeout 5 --max-time 30 \
                -D /tmp/profile-headers.txt -o /tmp/profile.html \
                -w '%{http_code}' "$PROFILE_ORIGIN/" || true)
              test_code=$(curl -sS --connect-timeout 5 --max-time 30 \
                -D /tmp/profile-test-headers.txt -o /tmp/profile-test.html \
                -w '%{http_code}' "$PROFILE_ORIGIN/kiem-tra-dau-vao/" || true)
              internal_code=$(curl -sS --connect-timeout 5 --max-time 30 \
                -D /tmp/profile-internal-headers.txt -o /tmp/profile-internal.html \
                -w '%{http_code}' "$PROFILE_ORIGIN/noi-bo/" || true)
              if [ "$home_code" = "200" ] \
                && grep -qi '^content-type: text/html' /tmp/profile-headers.txt \
                && grep -qi '^cache-control:.*no-store' /tmp/profile-headers.txt \
                && grep -qi '^x-robots-tag:.*noindex' /tmp/profile-headers.txt \
                && grep -Fq "Trang web đang trong quá trình phát triển" /tmp/profile.html \
                && ! grep -Fq "lead-api" /tmp/profile.html \
                && [ "$test_code" = "200" ] \
                && grep -qi '^content-type: text/html' /tmp/profile-test-headers.txt \
                && grep -Fq "Trang web đang trong quá trình phát triển" /tmp/profile-test.html \
                && ! grep -Fq "lead-api" /tmp/profile-test.html \
                && [ "$internal_code" = "200" ] \
                && grep -qi '^content-type: text/html' /tmp/profile-internal-headers.txt \
                && grep -Fq "Trang web đang trong quá trình phát triển" /tmp/profile-internal.html \
                && ! grep -Fq "Kịch bản tư vấn" /tmp/profile-internal.html; then
                echo "profile maintenance smoke OK after attempt $attempt"
                exit 0
              fi
              echo "attempt $attempt: home=$home_code test=$test_code internal=$internal_code, retrying in 20s"
              sleep 20
            done
            echo "::error::profile maintenance page did not pass smoke checks within 10 minutes of deploy"
            exit 1
          fi
          for attempt in $(seq 1 30); do
            home_code=$(curl -sS --connect-timeout 5 --max-time 30 \
              -D /tmp/profile-headers.txt -o /tmp/profile.html \
              -w '%{http_code}' "$PROFILE_ORIGIN/" || true)
            test_code=$(curl -sS --connect-timeout 5 --max-time 30 \
              -D /tmp/profile-test-headers.txt -o /tmp/profile-test.html \
              -w '%{http_code}' "$PROFILE_ORIGIN/kiem-tra-dau-vao/" || true)
            redir_code=$(curl -sS --connect-timeout 5 --max-time 30 \
              -D /tmp/profile-redir-headers.txt -o /dev/null \
              -w '%{http_code}' "$PROFILE_ORIGIN/kiem-tra-dau-vao" || true)
            video_code=$(curl -sS --connect-timeout 5 --max-time 30 \
              -I -D /tmp/profile-video-headers.txt -o /dev/null \
              -w '%{http_code}' "$PROFILE_ORIGIN/huong-dan-kiem-tra-dau-vao.mp4" || true)
            if [ "$home_code" = "200" ] \
              && grep -qi '^content-type: text/html' /tmp/profile-headers.txt \
              && grep -Fq "<meta name=\"lead-api\" content=\"$API_BASE_URL\">" /tmp/profile.html \
              && [ "$test_code" = "200" ] \
              && grep -qi '^content-type: text/html' /tmp/profile-test-headers.txt \
              && grep -Fq "<meta name=\"lead-api\" content=\"$API_BASE_URL\">" /tmp/profile-test.html \
              && echo "$redir_code" | grep -Eq '^(301|307|308)$' \
              && grep -Eiq '^location:.*kiem-tra-dau-vao/' /tmp/profile-redir-headers.txt \
              && [ "$video_code" = "200" ] \
              && grep -qi '^content-type: video/mp4' /tmp/profile-video-headers.txt; then
              echo "profile smoke OK after attempt $attempt"
              exit 0
            fi
            echo "attempt $attempt: home=$home_code test=$test_code redir=$redir_code video=$video_code, retrying in 20s"
            sleep 20
          done
          echo "::error::profile did not pass smoke checks within 10 minutes of deploy"
          exit 1
      - name: Notify Discord release changelog
        if: ${{ !inputs.dry_run }}
        timeout-minutes: 2
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node scripts/notify-discord-changelog.mjs --stage staging
