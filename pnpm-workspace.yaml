packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  sharp: true
  msgpackr-extract: true
  workerd: true
# A second workers-types version from @alchemy.run/cloudflare splits drizzle-orm
# into two peer variants, and their table types stop matching across packages.
overrides:
  "@cloudflare/workers-types": 5.20260815.1

catalog:
  dotenv: ^17.4.2
  zod: ^4.4.3
  typescript: ^6.0.3
  "@types/node": ^22.20.1
  "@cloudflare/workers-types": ^5.20260728.1
  better-auth: 1.7.16
  "@playwright/test": 1.62.1
  drizzle-orm: ^0.45.2
  "@libsql/client": 0.17.4
  lucide-react: ^1.27.0
  next-themes: ^0.4.6
  react: ^19.2.8
  react-dom: ^19.2.8
  sonner: ^2.0.7
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3
  tailwindcss: ^4.3.3
  exceljs: ^4.4.0
  "@tiptap/react": ^3.31.0
  "@tiptap/starter-kit": ^3.31.0
  "@tiptap/extension-placeholder": ^3.31.0
  dompurify: ^3.2.4
  jsdom: ^26.0.0
  "@testing-library/react": ^16.1.0
  "@testing-library/dom": ^10.4.0
