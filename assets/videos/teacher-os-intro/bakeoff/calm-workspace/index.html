<!DOCTYPE html>
<!--
  motion-video composition — bake-off scene "s01-hook", style: calm-workspace.
  Notion-like quiet document workspace: off-white page, Fraunces serif headings,
  monoline doodles, blocks that type, drag and settle. Energy 1: no flash, no
  shake, no beat-driven motion; the single camera move is settleCam.
-->
<html lang="vi" data-resolution="landscape" data-ratio="16x9">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Teacher OS — s01-hook — calm-workspace</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Local variable fonts (OFL, google/fonts); both carry the vietnamese subset. */
      @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-VF.ttf") format("truetype"); font-weight: 100 900; font-display: block; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-VF.ttf") format("truetype"); font-weight: 100 900; font-display: block; }
      :root {
        --bg: #fbfbfa; --ink: #191919; --mute: #7c7a73; --hair: #e8e6e1;
        --accent: #3a6fe0; --highlight: #fbeed0; --red: #d4553a; --green: #177e5f;
        --W: 1920px; --H: 1080px;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--bg); }
      #root { position: relative; width: var(--W); height: var(--H); overflow: hidden; background: var(--bg); color: var(--ink); font-family: "Inter", sans-serif; }
      .layer { position: absolute; left: 0; top: 0; width: var(--W); height: var(--H); }
      .abs { position: absolute; }
      .scene { opacity: 0; visibility: hidden; }
      /* Fraunces 600 72px headings, opsz 72, -0.01em, left-aligned on the page column */
      .hdoc { font-family: "Fraunces", serif; font-weight: 600; font-size: 72px; line-height: 1.35; letter-spacing: -0.01em; color: var(--ink); font-optical-sizing: none; font-variation-settings: "opsz" 72; white-space: nowrap; }
      .draw { stroke-dasharray: 1; stroke-dashoffset: 1; }
      /* doc blocks: 1px hair-bordered rectangles, radius 4, light shadow only */
      .chip { width: 260px; height: 70px; background: #fff; border: 1px solid var(--hair); border-radius: 4px; display: flex; align-items: center; gap: 14px; padding: 0 20px; box-shadow: 0 1px 2px rgba(25, 25, 25, 0.04); }
      .clabel { font: 400 30px/1 "Inter", sans-serif; color: var(--ink); }
      .cicon { width: 28px; height: 28px; flex: 0 0 auto; }
      .handle { position: absolute; left: -36px; top: 50%; transform: translateY(-50%); width: 16px; height: 24px; opacity: 0; }
      /* the workspace card: white sheet, hair border, one highlight fill (title row) */
      #card { width: 900px; height: 330px; background: #fff; border: 1px solid var(--hair); border-radius: 4px; box-shadow: 0 1px 2px rgba(25, 25, 25, 0.03); }
      #card-title { position: absolute; left: 12px; top: 12px; width: 876px; height: 56px; background: var(--highlight); border-radius: 4px; display: flex; align-items: center; gap: 12px; padding: 0 18px; }
      #card-title .clabel { font-weight: 500; font-size: 28px; }
      #fade { background: var(--bg); opacity: 1; pointer-events: none; }
      /* signature, bottom-right, styled to the page: serif ink, hairline underline */
      #sig { right: 40px; bottom: 22px; width: 250px; height: 130px; }
      #sig-txt { position: absolute; right: 18px; bottom: 30px; font: 600 52px/1 "Fraunces", serif; color: var(--mute); font-optical-sizing: none; font-variation-settings: "opsz" 40; }
      #sig svg { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.5" data-width="1920" data-height="1080">
      <div id="bg" class="layer"></div>
      <div id="stage" class="layer">
        <section id="sc01" class="scene layer">
          <!-- headline on the page column (left 410, width 1100) -->
          <div id="h1a" class="abs hdoc" style="left: 410px; top: 236px;" data-layout-allow-overflow data-layout-allow-overlap>Bạn dạy rất giỏi.</div>
          <div id="h1b" class="abs hdoc" style="left: 410px; top: 333px;" data-layout-allow-overflow>Mọi thứ rải rác khắp nơi.</div>
          <!-- crossfades over #h1a/#h1b on purpose -->
          <div id="h2" class="abs hdoc" style="left: 410px; top: 236px;" data-layout-allow-overflow data-layout-allow-overlap>Teacher OS</div>
          <!-- tidy workspace card the blocks settle into -->
          <div id="card" class="abs" style="left: 410px; top: 520px;">
            <div id="card-title">
              <svg width="16" height="24" viewBox="0 0 16 24" aria-hidden="true"><g fill="var(--mute)"><circle cx="5" cy="4" r="1.6"/><circle cx="11" cy="4" r="1.6"/><circle cx="5" cy="12" r="1.6"/><circle cx="11" cy="12" r="1.6"/><circle cx="5" cy="20" r="1.6"/><circle cx="11" cy="20" r="1.6"/></g></svg>
              <span id="card-label" class="clabel" data-layout-allow-overflow data-layout-allow-overlap>Teacher OS</span>
            </div>
          </div>
          <!-- monoline doodle to the right of the column: sprout in a pot -->
          <svg id="doodle" class="abs" style="left: 1520px; top: 560px;" width="260" height="220" viewBox="0 0 260 220" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path id="dd-stem" class="draw" pathLength="1" d="M130,142 V78"/>
            <path id="dd-leafL" class="draw" pathLength="1" d="M130,112 C108,108 94,90 96,68 C118,72 132,90 130,112 Z"/>
            <path id="dd-leafR" class="draw" pathLength="1" d="M130,92 C152,88 166,70 164,48 C142,52 128,70 130,92 Z"/>
            <path id="dd-pot" class="draw" pathLength="1" d="M92,142 H168 L158,196 H102 Z"/>
            <path id="dd-ground" class="draw" pathLength="1" d="M60,206 H200"/>
          </svg>
          <!-- scattered admin blocks (messy doc blocks on a page); they are dragged over the page on purpose -->
          <div class="chip abs" id="chip0" style="left: 300px; top: 150px;" data-layout-allow-overlap>
            <svg class="handle" viewBox="0 0 16 24" aria-hidden="true"><g fill="var(--mute)"><circle cx="5" cy="4" r="1.6"/><circle cx="11" cy="4" r="1.6"/><circle cx="5" cy="12" r="1.6"/><circle cx="11" cy="12" r="1.6"/><circle cx="5" cy="20" r="1.6"/><circle cx="11" cy="20" r="1.6"/></g></svg>
            <svg class="cicon" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3,10 H21"/><path d="M8,3 V7"/><path d="M16,3 V7"/></svg>
            <span class="clabel">Lịch học</span>
          </div>
          <div class="chip abs" id="chip1" style="left: 1290px; top: 140px;" data-layout-allow-overlap>
            <svg class="handle" viewBox="0 0 16 24" aria-hidden="true"><g fill="var(--mute)"><circle cx="5" cy="4" r="1.6"/><circle cx="11" cy="4" r="1.6"/><circle cx="5" cy="12" r="1.6"/><circle cx="11" cy="12" r="1.6"/><circle cx="5" cy="20" r="1.6"/><circle cx="11" cy="20" r="1.6"/></g></svg>
            <svg class="cicon" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9,13 l2.5,2.5 L16,10"/></svg>
            <span class="clabel">Bài chấm</span>
          </div>
          <div class="chip abs" id="chip2" style="left: 250px; top: 780px;" data-layout-allow-overlap>
            <svg class="handle" viewBox="0 0 16 24" aria-hidden="true"><g fill="var(--mute)"><circle cx="5" cy="4" r="1.6"/><circle cx="11" cy="4" r="1.6"/><circle cx="5" cy="12" r="1.6"/><circle cx="11" cy="12" r="1.6"/><circle cx="5" cy="20" r="1.6"/><circle cx="11" cy="20" r="1.6"/></g></svg>
            <svg class="cicon" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="3"/></svg>
            <span class="clabel">Học phí</span>
          </div>
          <div class="chip abs" id="chip3" style="left: 1320px; top: 762px;" data-layout-allow-overlap>
            <svg class="handle" viewBox="0 0 16 24" aria-hidden="true"><g fill="var(--mute)"><circle cx="5" cy="4" r="1.6"/><circle cx="11" cy="4" r="1.6"/><circle cx="5" cy="12" r="1.6"/><circle cx="11" cy="12" r="1.6"/><circle cx="5" cy="20" r="1.6"/><circle cx="11" cy="20" r="1.6"/></g></svg>
            <svg class="cicon" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="3"/><path d="M8,17 V21 L12.5,17"/><g fill="var(--ink)" stroke="none"><circle cx="8.5" cy="10.5" r="1.2"/><circle cx="12" cy="10.5" r="1.2"/><circle cx="15.5" cy="10.5" r="1.2"/></g></svg>
            <span class="clabel">Nhóm chat</span>
          </div>
        </section>
      </div>
      <div id="sig" class="abs">
        <svg viewBox="0 0 250 130" width="250" height="130"><path id="sig-line" class="draw" pathLength="1" d="M20,112 C80,100 150,118 236,96" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/></svg>
        <div id="sig-txt" data-layout-allow-overflow>Zuey</div>
      </div>
      <div id="fade" class="layer"></div>
      <audio id="mix" src="assets/audio/mix.m4a" data-start="0" data-duration="6.5" data-track-index="10" data-volume="1"></audio>
    </div>

    <script>/*TIMING:BEGIN*/window.TIMING={"duration":6.5,"fps":30,"beat0":0.5,"beatLen":0.5,"kick":[[0,12]],"drops":[4],"outroBeat":12,"scenes":{"s01-hook":{"start":0.5,"end":6.5,"lines":[{"on":0.5,"off":6.5,"words":[]}]}},"captions":[],"sfx":[],"env":[]};/*TIMING:END*/</script>
    <script>
      (() => {
        const T = window.TIMING;
        const tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;

        // ---------- lookups: every time comes from TIMING, never the wall clock ----------
        const $ = (s, r = document) => r.querySelector(s);
        const B = (n) => T.beat0 + T.beatLen * n; // quarter note n
        const DROP = B(T.drops[0]); // beat 4 -> the payoff
        // seeded PRNG: Math.random would make every render different
        const rng = (seed) => () => {
          seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };

        // ---------- animation vocabulary (the calm subset: no slam, no shake, no flash) ----------
        const rise = (e, t, o = {}) => tl.fromTo(e, { autoAlpha: 0, y: o.y ?? 40 }, { autoAlpha: 1, y: 0, duration: o.d ?? 0.5, ease: o.ease ?? "power3.out" }, t);
        const draw = (e, t, d = 0.6, ease = "power2.inOut") => tl.fromTo(e, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease }, t);
        const typeIn = (e, t, o = {}) => {
          const el = typeof e === "string" ? $(e) : e;
          const n = Math.max(1, el.textContent.replace(/\s+/g, " ").trim().length);
          const d = o.d ?? n * 0.035; // one step per glyph, like a doc block typing
          tl.fromTo(el, { clipPath: "inset(-20% 100% -20% 0%)" }, { clipPath: "inset(-20% 0% -20% 0%)", duration: d, ease: `steps(${n})` }, t);
          tl.set(el, { clipPath: "none" }, t + d);
        };
        // settleCam: the single camera move — a slow push over the closing hold
        const settleCam = (e, t0, t1, amt = 0.035) => tl.fromTo(e, { scale: 1 }, { scale: 1 + amt, duration: Math.max(0.1, t1 - t0), ease: "none" }, t0);

        // ---------- open: soft fade from the blank page, headline types on ----------
        tl.fromTo("#fade", { opacity: 1 }, { opacity: 0, duration: 0.5, ease: "power1.inOut" }, 0);
        tl.set("#sc01", { autoAlpha: 1 }, 0);
        typeIn("#h1a", B(0));
        typeIn("#h1b", B(1));

        // ---------- scattered admin blocks: rise, then drift untidily until the drop ----------
        const CW = 260, CH = 70, S = 1.5; // chip size and the scale it settles at inside the card
        const CHIPS = [
          { id: "#chip0", left: 300, top: 150, rot: -4, cell: [422, 606], beat: 0.5 },
          { id: "#chip1", left: 1290, top: 140, rot: 3, cell: [868, 606], beat: 1.0 },
          { id: "#chip2", left: 250, top: 780, rot: 2.5, cell: [422, 731], beat: 1.5 },
          { id: "#chip3", left: 1320, top: 762, rot: -3, cell: [868, 731], beat: 2.0 },
        ];
        CHIPS.forEach((c, i) => {
          const el = $(c.id);
          const r = rng(11 + i * 7);
          tl.set(el, { rotation: c.rot, transformOrigin: "50% 50%" }, 0);
          rise(el, B(c.beat), { y: 26, d: 0.45, ease: "power2.out" });
          // drift: two chained sine segments, small x/y/rotation wobble, ending exactly at the drop
          const a1 = { x: (r() - 0.5) * 10, y: (r() - 0.5) * 12, rotation: c.rot + (r() - 0.5) * 1.2 };
          const a2 = { x: (r() - 0.5) * 10, y: (r() - 0.5) * 12, rotation: c.rot + (r() - 0.5) * 1.2 };
          const t1 = B(c.beat) + 0.45;
          const d1 = Math.min(0.8, (DROP - t1) * 0.5);
          tl.fromTo(el, { x: 0, y: 0, rotation: c.rot }, { x: a1.x, y: a1.y, rotation: a1.rotation, duration: d1, ease: "sine.inOut", immediateRender: false }, t1);
          tl.fromTo(el, { x: a1.x, y: a1.y, rotation: a1.rotation }, { x: a2.x, y: a2.y, rotation: a2.rotation, duration: DROP - (t1 + d1), ease: "sine.inOut", immediateRender: false }, t1 + d1);
          // payoff drag: handle appears in the gutter, block lifts with a light shadow, slides home (power2.inOut)
          const grab = DROP + 0.05 + i * 0.14;
          const tx = c.cell[0] - c.left + ((S - 1) * CW) / 2; // scale is about center: offset compensates
          const ty = c.cell[1] - c.top + ((S - 1) * CH) / 2;
          tl.fromTo($(c.id + " .handle"), { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.15, ease: "power1.out", immediateRender: false }, grab - 0.02);
          tl.to(el, { y: a2.y - 5, scale: 1.03, duration: 0.12, ease: "power2.out" }, grab);
          tl.to(el, { boxShadow: "0 10px 22px rgba(25, 25, 25, 0.10)", duration: 0.12, ease: "power1.out" }, grab);
          tl.fromTo(el, { x: a2.x, y: a2.y - 5, rotation: a2.rotation, scale: 1.03 }, { x: tx, y: ty, rotation: 0, scale: S, duration: 0.5, ease: "power2.inOut", immediateRender: false }, grab + 0.12);
          tl.to(el, { boxShadow: "0 1px 2px rgba(25, 25, 25, 0.04)", duration: 0.35, ease: "power1.inOut" }, grab + 0.48);
          tl.to($(c.id + " .handle"), { autoAlpha: 0, duration: 0.18, ease: "power1.in" }, grab + 0.5);
        });

        // ---------- the workspace card appears as the drop lands; its label types in ----------
        rise("#card", DROP, { y: 18, d: 0.4, ease: "power2.out" });
        typeIn("#card-label", DROP + 0.15);

        // ---------- headline crossfade: the two chaos lines soften out while "Teacher OS" types in ----------
        tl.to(["#h1a", "#h1b"], { autoAlpha: 0, duration: 0.45, ease: "power1.inOut" }, B(6.5));
        typeIn("#h2", B(6.5));

        // ---------- monoline doodle draws beside the card, then the page settles ----------
        draw("#dd-stem", B(7), 0.45, "power2.inOut");
        draw("#dd-leafL", B(7) + 0.35, 0.4, "power2.inOut");
        draw("#dd-leafR", B(7) + 0.55, 0.4, "power2.inOut");
        draw("#dd-pot", B(7) + 0.8, 0.4, "power2.inOut");
        draw("#dd-ground", B(7) + 1.05, 0.3, "power2.out");

        // ---------- signature (bottom-right, from 1.0 s to the end) ----------
        tl.fromTo("#sig-txt", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(-20% -20% -20% 0%)", duration: 0.5, ease: "steps(4)" }, 1.0);
        tl.set("#sig-txt", { clipPath: "none" }, 1.55);
        draw("#sig-line", 1.4, 0.35, "power2.out");

        // ---------- the one camera move: gentle push through the closing hold ----------
        settleCam("#stage", B(7.5), T.duration, 0.035);

        // ---------- close on a soft fade to the page colour ----------
        tl.to("#fade", { opacity: 1, duration: 0.5, ease: "power1.in" }, T.duration - 0.5);

        tl.set({}, {}, T.duration); // pin the timeline length to the video duration
      })();
    </script>
  </body>
</html>
